[project]
name = "nebulai"
version = "0.2.0"
description = "Nebul.AI — a semantic cloud of a micro model's concept space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "safetensors",
    "huggingface-hub",
    "tokenizers",
    "umap-learn",
    "scikit-learn>=1.4",
    "datamapplot",
    "matplotlib",
    "anthropic",
]

[project.scripts]
nebulai = "nebulai.cli:main"
seer = "nebulai.seer.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
# `network` tests hit the real Hugging Face hub, so they are deselected by
# default; opt in with `pytest -m network` (the trailing -m wins over addopts)
markers = ["network: opt-in test that makes a real network request"]
addopts = "-m 'not network'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebulai"]
